<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15.1- practice 2 - Random Number Generation in Javascript Building a Love Calculator</title>
</head>
<body>
    <script>
        prompt("What is your name?");
        prompt("What is their name?");

        //equation part
        //a) create random num from range (0-99.9999999999999999)
        var loveScore = Math.random()*100;
        //b) create solid number, add +1 to get range (1-100)
        loveScore=Math.floor(loveScore)+1;

        alert("Your love score is "+ loveScore + "%");

    </script>
</body>
</html>
