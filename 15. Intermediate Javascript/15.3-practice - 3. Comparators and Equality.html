<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15.3. Comparators and Equality</title>
</head>
<body>
    <script>

        /**
         * 
          types of comparators - 
          ===   is equal to
          !==   is not equal to
          >     is greater than 
          <     is less  than 
          >=    is greater or equal to
          <=    is less or equal to
        
        **/


        a=1;//typeOf number
        b="1";//typeOf string

        //number==string for "=="
        if(a==b){
            alert("yes for ==");
        }else{
            alert("no for == ");
        }

        //number!== string for "==="
        if(a===b){
            alert("Yes for ===");
        }else{
            alert("no for ===");
        }
    </script>
</body>
</html>
