<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        /*
            Write a program that prints the numbers form 1-100.
             But for multiples of three print "fizz" instead of the number 
             and for the multiples of five print "buzz". 
             for numbers which are multiples of both three and five print "FizzBuzz"
        
        */

        //***note: you can call function in "inspect>console> write the call function name and hit enter". everytime you write and hit enter, everytime it will call

        // track lines equation (a-d)

        //a) main container
        var output  = []
                //b) container item + increase item
                var count = 1;

        function fizzBuzz(){

                        //c)adding control flow with item, push in container
                        /* if "count" divisible by both = fizzbuzz , the numbers divisible by 3 = fizz, if divisible by 5= buzz, */

                        if(count%3===0 && count%5===0){
                            output.push("fizzBuzz");
                        }
                        
                        else if(count%3===0){
                            output.push("fizz");
                        }
                        else if(count%5===0){
                            output.push("buzz");
                        }

                        else{
                //b1)push control flow items "if-else count" ,into container "output"
                output.push(count);
                            };


                //b2)increase item "count"
                count++;
                //d)console.log full pushed
                console.log(output)
         
        }
        


    </script>
</body>
</html>
