<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15.3- practice- control statement while loop : 8/12/25</title>
</head>
<body>
    <script>
        /*
            syntax: while(something is true){
                //do this
            }

        loops has 3 works with "one/same variable"=1)start 2)end 3)change
            example: 
                
            //1)start point
                var i =0; 
               
                //2) end before 2
                    var(i<2) { 
                    console.log(i); 

                    //3)change: increase i by 1
                        i++;
                    }
        */





        //track equation (a-f)
          //a) main container
            var output = []
            //b) container item + increase item
            var count = 1;

            function fizzBuzz() {

                //e)control statement, 100 times loop throug the count,push
                while(count<=100){
                        //c)adding control flow with item, push in container
                        /* if "count" divisible by both = fizzbuzz , the numbers divisible by 3 = fizz, if divisible by 5= buzz, */

                        if (count % 3 === 0 && count % 5 === 0) {
                            output.push("fizzBuzz");
                        }

                        else if (count % 3 === 0) {
                            output.push("fizz");
                        }
                        else if (count % 5 === 0) {
                            output.push("buzz");
                        }

                        else {
                            //c1> b1)push control flow items "if-else count" ,into container "output"
                            output.push(count);
                        };
                        //b2)increase item "count"
                        count++;
                };

                //f)> d)console.log full pushed array
                console.log(output)

            }
    </script>
</body>
</html>
