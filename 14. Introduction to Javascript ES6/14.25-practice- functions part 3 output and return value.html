<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14.25-practice- functions part 3 output and return value</title>
</head>

<body>
    <script>

        function getMilk(money) {

            alert("go to store");
            alert("get milk of " + money + " taka  ");

            //suppose , per bottle price is 1.5 taka .
            //a.2) Math.floor() function is used for "round a decimal number" . ex:3.56 will come 3 >
            //a.2.1)numberOfBottle= parent scope variable [can only used in function scope]

            var numberOfBottle = Math.floor(money / 1.5); //changed from: var numberOfBottle = bottle / 1.5;

            alert(numberOfBottle + " bottles will come from " + money + " taka");
            alert("get " + numberOfBottle + " bottles ")
            alert("come back home");

            // a)return calculates> a.1)but its calculation is needed to store out of function scope >  a.1.1)in a variable while calling the function
                
            return money%1.5; 
            
        };
        //2)function has "return" so  > 2.1) while call function ,  put it in a variable "change" >
        var change= getMilk(13); //changed from getMilk()
                alert("Money Remains " + change + " Taka ");


    </script>
</body>

</html>
