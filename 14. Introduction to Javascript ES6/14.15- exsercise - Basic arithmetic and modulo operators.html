<body>
    <script>
        // Exc:Dog age to Human age formula : var humanAge= ((dogAge-2)*4)+21;
            // guess a dogAge is input 25, so humanAge is ((25-2)*4)+21= 109 human years


            //1) take your dogs age via prompt > 1.1)put prompt value in dogAge varialbe  
            dogAge = prompt("How old is your dog?")

            //2)use the formula 
            var humanAge = ((dogAge - 2) * 4) + 21;

            //3) show result 
            alert("Your dog is " + humanAge + " years old in human years.");
    </script>
