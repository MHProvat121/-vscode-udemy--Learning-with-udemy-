<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14.11-Excercise-string length and retrieving Number</title>
</head>
<body>
    
    <script>

        input = prompt("Write Your Message"); //a)take message input from user
            len = input.length;     //b)find length of input
            remain = 280 - len;        //c)calculate remaining numbers
            alert("Typed total: " + len + " characters. Remaining: " + remain + " characters."); //d) show result by alert function

    </script>
</body>
</html>
