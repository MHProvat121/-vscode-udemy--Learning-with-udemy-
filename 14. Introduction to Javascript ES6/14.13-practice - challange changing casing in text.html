<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14.13-practice - challange changing casing in text</title>
</head>
<body>
    <script>
        var name = "Provat";
            name.toUpperCase();
            console.log(name);

            //1)re-assign name variable, new value in toUpperCase
            name = name.toUpperCase();
            console.log(name);

            //2) re-assign name variable, new value in toLowerCase
            name = name.toLowerCase();
            console.log(name);
    </script>
    
</body>
</html>
