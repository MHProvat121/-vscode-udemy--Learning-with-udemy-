<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14.7- excercise - variable excersise.js</title>
</head>
<body>

    <script>



        function test() {
                var a = "3";
                var b = "8";

                var c = a; //c=3,a=0
                a = b; //a=8,b=0
                b = c; //b=3,c=0


                console.log("a is " + a);
                console.log("b is " + b);
            }

            test(); // call the function




    </script>
    
</body>
