    <script>
        /*Life in Weeks Coding Exercise
        I was reading this article by Tim  Urban - Your Life in Weeks and realised just how little time we actually have.
        In this challenge, you are going to create a function that tells us how many days weeks and months we have left if we life until 90 years old.


        it will take your current age as the input and console.logs a message with out time left in this format:
        you have x days , y weeks , and z months left 
        where x,y and z are replaced with the actual calculated numbers .

        --------------------------------------------------------------
        for this challenge , assume there are 365 days in a year , 52 weeks in a year and 12 months in a year .
        
        IMPORTANT your console.log output should match the Example Output exactly, even the positions of the commas and full stops.
        Example Input
        e.g. If you are 56 years old:
            lifeInWeeks(56)
        Example Output
            You have 12410 days , 1768 weeks , and 408 months left. 

        Hint
            1. Try using this Repl.it playground to test your code and see if the output is what you expect it tot be
            2. try copyting the example output into your code and replace the relevant parts so that the sentence is formated the same way

        */

        function lifeInWeeks (age){

            /************** Don't change the code above ***************/
            //write your code here. 
           
            
            var yearRemaining = 90-age;
            var days = yearRemaining* 365;
            var weeks = yearRemaining * 52;
            var months= yearRemaining *12;
            console.log("You have "+days+" days, "+weeks+ " weeks,  "+months+ " months, and  " + yearRemaining+' years left')

            /**********************Don't change the code below**************/
        }
        lifeInWeeks(27);
