<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14.16- practice - increment and decrement expression</title>
</head>
<body>
    <script>
        /* ---------------------
    
    signs are = 
    a)increment/decrement by 1 : ++,--,
    b)increment/decrement by any number : +=, -=, *=, /=, %=
    --------------------------
    */

            //Examples: 

            //a)increment/decrement by 1 : ++,--,
            //ex1- 
            var a = 5;
            a = a + 1; // output:6
            console.log(a);

            //ex1.1) equavalent of  ex1-
            var x = 5;
            x++; //output:6
            console.log(x);


            //b)increment/decrement by any number : +=, -=, *=, /=, %=
            //ex2-
            b = 5;
            b = b + 2; //output: 7
            console.log(b);

            //ex2.1) equavalent of  ex2-
            var y = 5;
            y += 2; //output: 7
            console.log(y);
    </script>
</body>
</html>
