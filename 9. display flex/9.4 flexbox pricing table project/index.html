<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /*global font*/
      body {
        font-family: "Sono", sans-serif;
      }
      /*big step 1: Parent div 1=container setup*/
      .pricing-container {
        display: flex;
        justify-content: center;/*centering flex items horizontally - x axis wise*/
        align-items: center; /*centering flex items vertically- y axis wise*/
        height: 100vh; /*here total vh of main viewport is 100 so 100vh=100% of viewport "height"*/
        gap: 2rem; /* here root element for rem is html element font-size which is 16px by default so 2rem=32px gap between child divs*/
        background-color: green;
      }
      /*big step 2: Child div 1.1,1.2,1.3=pricing plan setup*/
      .pricing-plan{
        background-color: white;
        flex: 1; /*flex-grow:1; flex-shrink:1; flex-basis:0;*/
        padding: 20px;/*inner spacing of all childs */
        max-width: 400px;
        border-radius: 5px;
        text-align: center;/*centering text inside child divs*/
        
      }
      /*step 3:  title setup*/
      .plan-title{
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;/*spacing below title*/
      }
      .plan-price{
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      /*step 4: features setup*/
      .plan-features {
        list-style: none; /*removing default bullets*/
        padding: 0;
        margin: 0;
      }
      .plan-features li {
        margin-bottom: 20px;/*spacing between list items, push button down*/
      }

      /*step 5: button setup*/
      .plan-button{
        padding: 10px;
        background-color: #ff6600;
        color: #fff;
        border-radius: 5px;
        border: none;
      }

      /*step 6: responsive design for smaller screens*/
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column;
          height: 100%; /*adjusting height for smaller screens+ flex viewport is set  to 100*/
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
