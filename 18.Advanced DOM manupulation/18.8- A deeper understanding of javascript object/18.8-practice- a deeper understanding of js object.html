<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18.8-practice-a deeper understanding of js object</title>
</head>
<body>
    <script>
        /*
            A js object is like cell of excel sheet

            properties      bellboy1        bellboy2        bellboy3
            name              robert           john         kartik
            age                 19              20              24
            hasWorkPermit       yes             yes             yes
            languages   ["france","german"]     german          hindi

            a)create object:

            var bellboy1={
            name: "john",
            age:1,
            hasWorkPermit: "yes",
            language:["French", "German"]

            b)call object by their property:

            console.log(bellboy1.name)
            console.log(bellboy1.age)
            console.log(bellboy1.hasWorkPermit)
            console.log(bellboy1.language)

            c) you can call objects by their method names also (see in 18.9)

        }
        
        
        */
        // a)create object:
        var bellboy1={
            name: "john",
            age:1,
            hasWorkPermit: "yes",
            language:["French", "German"]
        }
        
        //b)b)call object by their property:
         console.log(bellboy1.name)
            console.log(bellboy1.age)
            console.log(bellboy1.hasWorkPermit)
            console.log(bellboy1.language)



    </script>
</body>
</html>
