<body>
    <script>
        /*
            1)constructor function is a function,
             which holds a demi of object. you can prottype other objects.

                    you just assign new object values, 
                    and demi will create a full prototype object

             2)constructor functions function name start with capital letter
    
        */ 
        
        //track (a-c)
        //a)create constructor function
        function BellBoy(Name,Age,Permit,Language){
            this.name=Name;
            this.age= Age;
            this.hasWorkPermit=Permit;
            this.language=Language;
        }
        //b)initialize/create prototype object for constructor function
        var bellboy1= new BellBoy("Tim",19,true,["french","german"]);

        //c) call object by property
        console.log(bellboy1);
        console.log(bellboy1.name);
        console.log(bellboy1.age)

        var bellboy2 = new BellBoy("john", 29, true, ["jew", "euro"]);
            console.log(bellboy2);
    </script>
